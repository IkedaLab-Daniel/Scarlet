<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chibi Pet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
      min-width: 200px;
      min-height: 500px;
      font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }

    :root {
      --pomo-bg: rgba(255, 246, 248, 0.92);
      --pomo-border: #f1b3c0;
      --pomo-accent: #e8607a;
      --pomo-break: #f0b15a;
      --pomo-shadow: 0 6px 18px rgba(200, 100, 130, 0.2), 0 2px 6px rgba(0,0,0,0.08);
    }

    #app {
      width: 100%;
      height: 100%;
      min-width: 200px;
      min-height: 500px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    /* ── Pomodoro ── */
    #pomodoro {
      width: 100%;
      margin-bottom: 8px;
      padding: 8px 10px 9px;
      border-radius: 14px;
      background: var(--pomo-bg);
      border: 2px solid var(--pomo-border);
      box-shadow: var(--pomo-shadow);
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-app-region: no-drag;
      font-family: 'Chalkboard SE', 'Comic Sans MS', 'Segoe UI', sans-serif;
    }

    #pomodoro.break {
      border-color: var(--pomo-break);
    }

    .pomo-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .pomo-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: #7a3b4b;
    }

    #pomodoro.break .pomo-label {
      color: #9a5a1a;
    }

    .pomo-time {
      font-size: 18px;
      font-weight: 700;
      color: #4a2a3a;
    }

    .pomo-controls {
      display: flex;
      gap: 6px;
    }

    .pomo-btn {
      flex: 1;
      border: none;
      border-radius: 9px;
      padding: 5px 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #e8607a, #c8405a);
      color: #fff;
      transition: transform 0.15s, filter 0.15s;
      -webkit-app-region: no-drag;
    }

    .pomo-btn:hover { transform: scale(1.04); filter: brightness(1.06); }
    .pomo-btn:active { transform: scale(0.98); }

    .pomo-btn.ghost {
      background: transparent;
      color: #7a3b4b;
      border: 1.5px dashed var(--pomo-border);
    }

    #pomodoro.break .pomo-btn.ghost {
      border-color: var(--pomo-break);
      color: #9a5a1a;
    }

    .pomo-bar {
      height: 5px;
      border-radius: 999px;
      background: rgba(232, 160, 176, 0.35);
      overflow: hidden;
    }

    .pomo-progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e8607a, #f59ab0);
      transition: width 0.25s linear;
    }

    #pomodoro.break .pomo-progress {
      background: linear-gradient(90deg, #f2b35d, #f07f3c);
    }

    /* ── Chat Bubble ── */
    #chat-area {
      position: absolute;
      bottom: 205px;
      left: 50%;
      transform: translateX(-50%);
      width: 190px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      transform-origin: bottom center;
      -webkit-app-region: no-drag;
      z-index: 2;
    }

    #chat-area.visible {
      opacity: 1;
      pointer-events: all;
      animation: bubbleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes bubbleIn {
      from { transform: translateX(-50%) scale(0.7) translateY(10px); opacity: 0; }
      to   { transform: translateX(-50%) scale(1)   translateY(0px);  opacity: 1; }
    }

    #bubble {
      background: rgba(255, 255, 255, 0.97);
      border: 2.5px solid #e8a0b0;
      border-radius: 18px;
      padding: 10px 13px;
      width: 100%;
      position: relative;
      box-shadow: 0 4px 20px rgba(200, 100, 130, 0.25), 0 2px 6px rgba(0,0,0,0.1);
      -webkit-app-region: no-drag;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 215px);
    }

    #chat-content {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex: 1 1 auto;
      min-height: 0;
      -webkit-app-region: no-drag;
    }

    /* Bubble tail */
    #bubble::after {
      content: '';
      position: absolute;
      bottom: -11px;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: #e8a0b0;
    }
    #bubble::before {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: rgba(255,255,255,0.97);
      z-index: 1;
    }

    #message-text {
      font-size: 12px;
      line-height: 1.5;
      color: #4a2a3a;
      min-height: 18px;
      word-break: break-word;
      -webkit-app-region: no-drag;
    }

    #message-text.typing::after {
      content: '●●●';
      display: inline-block;
      animation: dotPulse 1.2s infinite;
      font-size: 10px;
      letter-spacing: 2px;
      color: #e8a0b0;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* ── Process List ── */
    #process-list {
      width: 100%;
      margin-top: 6px;
      display: none;
      max-height: 140px;
      overflow-y: auto;
      -webkit-app-region: no-drag;
    }

    .process-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 2px;
      border-radius: 8px;
      -webkit-app-region: no-drag;
    }

    .process-item + .process-item {
      border-top: 1px dashed #f2c3d1;
    }

    .process-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: #f6d3dd;
      color: #7a3b4b;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .process-icon img {
      width: 18px;
      height: 18px;
      object-fit: cover;
    }

    .process-name {
      font-size: 11px;
      color: #4a2a3a;
      line-height: 1.3;
    }

    /* Input row inside bubble */
    #input-row {
      display: flex;
      gap: 5px;
      margin-top: 8px;
      align-items: center;
      -webkit-app-region: no-drag;
    }

    #user-input {
      flex: 1;
      border: 1.5px solid #f0c0d0;
      border-radius: 10px;
      padding: 5px 8px;
      font-size: 11px;
      background: #fff5f7;
      color: #4a2a3a;
      outline: none;
      transition: border-color 0.2s;
      -webkit-app-region: no-drag;
    }

    #user-input:focus {
      border-color: #e8a0b0;
    }

    #send-btn {
      background: linear-gradient(135deg, #e8607a, #c8405a);
      border: none;
      border-radius: 9px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, filter 0.15s;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    #send-btn:hover { transform: scale(1.1); filter: brightness(1.1); }
    #send-btn:active { transform: scale(0.95); }

    #send-btn svg {
      width: 14px;
      height: 14px;
      fill: white;
    }

    /* ── Quit button ── */
    #quit-btn {
      position: absolute;
      top: 2px;
      right: 8px;
      width: 18px;
      height: 18px;
      background: rgba(220, 80, 80, 0.75);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 100;
      color: white;
      font-size: 10px;
      line-height: 1;
      -webkit-app-region: no-drag;
    }

    #app:hover #quit-btn { opacity: 1; }
    #quit-btn:hover { background: rgba(200, 50, 50, 0.95); }

    /* ── Character Container ── */
    #character-wrap {
      position: relative;
      width: 180px;
      height: 210px;
      cursor: pointer;
      -webkit-app-region: drag;
      flex-shrink: 0;
      z-index: 1;
    }

    #character-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.15s;
      filter: drop-shadow(0 6px 18px rgba(180, 60, 80, 0.3));
      -webkit-app-region: no-drag;
      cursor: pointer;
      -webkit-user-drag: none;
      user-drag: none;
    }

    /* Idle float */
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      30%       { transform: translateY(-6px) rotate(0.5deg); }
      70%       { transform: translateY(-3px) rotate(-0.5deg); }
    }

    #character-img.idle {
      animation: float 3.5s ease-in-out infinite;
    }

    /* Click bounce */
    @keyframes bounce {
      0%  { transform: scale(1); }
      30% { transform: scale(1.12) translateY(-8px); }
      60% { transform: scale(0.95) translateY(2px); }
      100%{ transform: scale(1); }
    }

    #character-img.bouncing {
      animation: bounce 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
    }

    /* Sparkle emojis */
    .sparkle {
      position: absolute;
      font-size: 16px;
      pointer-events: none;
      animation: sparkleAnim 0.8s ease-out forwards;
      z-index: 50;
    }

    @keyframes sparkleAnim {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.4); }
    }
  </style>
</head>
<body>
  <div id="app">
    <button id="quit-btn" title="Close">✕</button>

    <!-- Chat bubble (hidden until click) -->
    <div id="chat-area">
      <div id="bubble">
        <!-- Pomodoro timer (always visible inside chat bubble) -->
        <div id="pomodoro" aria-live="polite">
          <div class="pomo-header">
            <span class="pomo-label" id="pomo-label">Work</span>
            <span class="pomo-time" id="pomo-time">25:00</span>
          </div>
          <div class="pomo-controls">
            <button id="pomo-toggle" class="pomo-btn" type="button">Start</button>
            <button id="pomo-reset" class="pomo-btn ghost" type="button">Reset</button>
          </div>
          <div class="pomo-bar" aria-hidden="true">
            <div id="pomo-progress" class="pomo-progress"></div>
          </div>
        </div>

        <div id="chat-content">
          <div id="message-text">Hey there~! Click me to chat! ✨</div>
          <div id="process-list" aria-live="polite"></div>
        </div>
        <div id="input-row">
          <input id="user-input" type="text" placeholder="Ask me anything..." maxlength="200" />
          <button id="send-btn" title="Send">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 21L23 12 2 3v7l15 2-15 2v7z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Character -->
    <div id="character-wrap">
      <img
        id="character-img"
        src="./character_default.png"
        alt="Chibi Pet"
        class="idle"
        draggable="false"
      />
    </div>
  </div>

  <script>
    const chatArea   = document.getElementById('chat-area');
    const messageText = document.getElementById('message-text');
    const processList = document.getElementById('process-list');
    const userInput  = document.getElementById('user-input');
    const sendBtn    = document.getElementById('send-btn');
    const charImg    = document.getElementById('character-img');
    const quitBtn    = document.getElementById('quit-btn');
    const app        = document.getElementById('app');
    const pomodoro   = document.getElementById('pomodoro');
    const pomoLabel  = document.getElementById('pomo-label');
    const pomoTime   = document.getElementById('pomo-time');
    const pomoToggle = document.getElementById('pomo-toggle');
    const pomoReset  = document.getElementById('pomo-reset');
    const pomoProgress = document.getElementById('pomo-progress');

    let chatOpen = false;
    let isTyping = false;
    let isDragging = false;
    let dragMoved = false;
    let dragStart = { x: 0, y: 0 };
    let windowStart = null;

    const POMO_WORK_SECONDS = 25 * 60;
    const POMO_BREAK_SECONDS = 5 * 60;
    let pomoMode = 'work';
    let pomoRemaining = POMO_WORK_SECONDS;
    let pomoTimer = null;
    let pomoRunning = false;

    const characterImages = [
      './character_default.png',
      './character_hello.png',
      './character_hi.png'
    ];

    function setRandomCharacter() {
      const next = characterImages[Math.floor(Math.random() * characterImages.length)];
      charImg.setAttribute('src', next);
    }

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
    }

    function updatePomodoroUI() {
      const maxSeconds = (pomoMode === 'work') ? POMO_WORK_SECONDS : POMO_BREAK_SECONDS;
      const progress = ((maxSeconds - pomoRemaining) / maxSeconds) * 100;

      pomoLabel.textContent = (pomoMode === 'work') ? 'Work' : 'Break';
      pomoTime.textContent = formatTime(pomoRemaining);
      pomoToggle.textContent = pomoRunning ? 'Pause' : 'Start';
      pomodoro.classList.toggle('break', pomoMode === 'break');
      pomoProgress.style.width = Math.max(0, Math.min(100, progress)) + '%';
    }

    function finishPomodoroSegment() {
      pomoMode = (pomoMode === 'work') ? 'break' : 'work';
      pomoRemaining = (pomoMode === 'work') ? POMO_WORK_SECONDS : POMO_BREAK_SECONDS;
    }

    function tickPomodoro() {
      if (!pomoRunning) return;
      pomoRemaining -= 1;
      if (pomoRemaining <= 0) {
        finishPomodoroSegment();
      }
      updatePomodoroUI();
    }

    function startPomodoro() {
      if (pomoRunning) return;
      pomoRunning = true;
      pomoTimer = setInterval(tickPomodoro, 1000);
      updatePomodoroUI();
    }

    function pausePomodoro() {
      if (pomoTimer) clearInterval(pomoTimer);
      pomoTimer = null;
      pomoRunning = false;
      updatePomodoroUI();
    }

    function resetPomodoro() {
      pausePomodoro();
      pomoMode = 'work';
      pomoRemaining = POMO_WORK_SECONDS;
      updatePomodoroUI();
    }

    pomoToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (pomoRunning) {
        pausePomodoro();
      } else {
        startPomodoro();
      }
    });

    pomoReset.addEventListener('click', (e) => {
      e.stopPropagation();
      resetPomodoro();
    });

    // ── Toggle chat on character click ──
    charImg.addEventListener('click', (e) => {
      if (dragMoved) {
        dragMoved = false;
        return;
      }
      e.stopPropagation();
      toggleChat();
      doBounce();
      spawnSparkles(e);
    });

    // ── Drag window by character ──
    charImg.addEventListener('mousedown', async (e) => {
      e.preventDefault();
      if (e.button !== 0) return;
      isDragging = true;
      dragMoved = false;
      dragStart = { x: e.screenX, y: e.screenY };
      windowStart = await window.petAPI.getWindowPosition();
    });

    charImg.addEventListener('dragstart', (e) => {
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging || !windowStart) return;
      const dx = e.screenX - dragStart.x;
      const dy = e.screenY - dragStart.y;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
        dragMoved = true;
      }
      window.petAPI.setWindowPosition({
        x: windowStart.x + dx,
        y: windowStart.y + dy
      });
    });

    window.addEventListener('mouseup', () => {
      if (dragMoved) {
        setTimeout(() => { dragMoved = false; }, 0);
      }
      isDragging = false;
    });

    function toggleChat() {
      chatOpen = !chatOpen;
      if (chatOpen) {
        chatArea.classList.add('visible');
        setTimeout(() => userInput.focus(), 100);
      } else {
        chatArea.classList.remove('visible');
      }
    }

    // ── Bounce animation ──
    function doBounce() {
      charImg.classList.remove('idle', 'bouncing');
      void charImg.offsetWidth; // reflow
      charImg.classList.add('bouncing');
      charImg.addEventListener('animationend', () => {
        charImg.classList.remove('bouncing');
        charImg.classList.add('idle');
      }, { once: true });
    }

    // ── Sparkle effect ──
    function spawnSparkles(e) {
      const emojis = ['✨','⭐','💫','🌟','❤️'];
      const wrap = document.getElementById('character-wrap');
      const rect = wrap.getBoundingClientRect();

      for (let i = 0; i < 4; i++) {
        const el = document.createElement('span');
        el.className = 'sparkle';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        const x = Math.random() * 160 - 20;
        const y = Math.random() * 100 + 20;
        el.style.left = x + 'px';
        el.style.top  = y + 'px';
        el.style.setProperty('--dx', (Math.random() * 40 - 20) + 'px');
        el.style.setProperty('--dy', -(Math.random() * 50 + 20) + 'px');
        el.style.animationDelay = (i * 0.08) + 's';
        wrap.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    function clearProcessList() {
      processList.innerHTML = '';
      processList.style.display = 'none';
    }

    function renderProcessList(apps) {
      clearProcessList();
      if (!apps || apps.length === 0) return;

      apps.forEach((app) => {
        const item = document.createElement('div');
        item.className = 'process-item';

        const iconWrap = document.createElement('div');
        iconWrap.className = 'process-icon';

        if (app.iconDataUrl) {
          const img = document.createElement('img');
          img.src = app.iconDataUrl;
          img.alt = '';
          iconWrap.appendChild(img);
        } else {
          const letter = (app.name || '?').slice(0, 1).toUpperCase();
          iconWrap.textContent = letter;
        }

        const name = document.createElement('div');
        name.className = 'process-name';
        name.textContent = app.name || 'Unknown';

        item.appendChild(iconWrap);
        item.appendChild(name);
        processList.appendChild(item);
      });

      processList.style.display = 'block';
    }

    // ── Command shortcuts ──
    async function tryHandleCommand(text) {
      const normalized = text.trim().toLowerCase();
      const isTeams = /^open\s+(microsoft\s+)?teams$/.test(normalized) || normalized === 'open ms teams';
      const isProcess = /^(display|show)\s+process(es)?$/.test(normalized);

      if (isTeams) {
        const result = await window.petAPI.openApp('teams');
        if (result && result.ok) {
          return { mode: 'text', text: 'Opening Microsoft Teams...' };
        }
        return {
          mode: 'text',
          text: (result && result.message) ? result.message : 'I could not open Microsoft Teams.'
        };
      }

      if (isProcess) {
        const result = await window.petAPI.getRunningApps();
        if (result && result.ok) {
          return { mode: 'processList', text: 'Running apps:', apps: result.apps };
        }
        return {
          mode: 'text',
          text: (result && result.message) ? result.message : 'I could not read running apps.'
        };
      }

      return null;
    }

    // ── Send message ──
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isTyping) return;

      isTyping = true;
      userInput.value = '';
      userInput.disabled = true;
      sendBtn.disabled = true;

      messageText.textContent = '';
      messageText.classList.add('typing');

      try {
        clearProcessList();
        const commandResult = await tryHandleCommand(text);
        if (commandResult) {
          messageText.classList.remove('typing');
          await typeWriter(commandResult.text || '');
          if (commandResult.mode === 'processList') {
            renderProcessList(commandResult.apps);
          }
        } else {
          setRandomCharacter();
          const reply = await window.petAPI.askGroq(text);
          messageText.classList.remove('typing');
          // Typewriter effect
          await typeWriter(reply);
        }
      } catch (err) {
        messageText.classList.remove('typing');
        messageText.textContent = 'Something went wrong~ (｡•́︿•̀｡)';
      }

      isTyping = false;
      userInput.disabled = false;
      sendBtn.disabled = false;
      userInput.focus();
    }

    function typeWriter(text) {
      return new Promise((resolve) => {
        messageText.textContent = '';
        let i = 0;
        const speed = Math.max(15, Math.min(40, 1200 / text.length));
        const timer = setInterval(() => {
          messageText.textContent += text[i++];
          if (i >= text.length) {
            clearInterval(timer);
            resolve();
          }
        }, speed);
      });
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
      e.stopPropagation();
    });

    // ── Stop click-through on chat area ──
    chatArea.addEventListener('click', (e) => e.stopPropagation());
    userInput.addEventListener('mousedown', (e) => e.stopPropagation());

    // ── Quit ──
    quitBtn.addEventListener('click', () => window.petAPI.quitApp());

    // ── Random idle dialogue ──
    const idleMessages = [
      'Click me to chat! ✨',
      "What's on your mind? 💭",
      'Need help? I\'m here~! 🌸',
      'Hello hello! (◕‿◕) ✨',
      'Ask me anything! 💫',
    ];
    let idleIdx = 0;

    setInterval(() => {
      if (!chatOpen && !isTyping) {
        messageText.textContent = idleMessages[idleIdx % idleMessages.length];
        idleIdx++;
        // brief bubble flash
        chatArea.classList.add('visible');
        setTimeout(() => {
          if (!chatOpen) chatArea.classList.remove('visible');
        }, 2500);
      }
    }, 18000);

    updatePomodoroUI();
  </script>
</body>
</html>
