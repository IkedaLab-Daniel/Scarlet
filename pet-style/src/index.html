<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chibi Pet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
      min-width: 200px;
      min-height: 340px;
      font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }

    #app {
      width: 100%;
      height: 100%;
      min-width: 200px;
      min-height: 340px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    /* ── Chat Bubble ── */
    #chat-area {
      position: absolute;
      bottom: 205px;
      left: 50%;
      transform: translateX(-50%);
      width: 190px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      transform-origin: bottom center;
      -webkit-app-region: no-drag;
    }

    #chat-area.visible {
      opacity: 1;
      pointer-events: all;
      animation: bubbleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes bubbleIn {
      from { transform: translateX(-50%) scale(0.7) translateY(10px); opacity: 0; }
      to   { transform: translateX(-50%) scale(1)   translateY(0px);  opacity: 1; }
    }

    #bubble {
      background: rgba(255, 255, 255, 0.97);
      border: 2.5px solid #e8a0b0;
      border-radius: 18px;
      padding: 10px 13px;
      width: 100%;
      position: relative;
      box-shadow: 0 4px 20px rgba(200, 100, 130, 0.25), 0 2px 6px rgba(0,0,0,0.1);
      -webkit-app-region: no-drag;
    }

    /* Bubble tail */
    #bubble::after {
      content: '';
      position: absolute;
      bottom: -11px;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: #e8a0b0;
    }
    #bubble::before {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: rgba(255,255,255,0.97);
      z-index: 1;
    }

    #message-text {
      font-size: 12px;
      line-height: 1.5;
      color: #4a2a3a;
      min-height: 18px;
      word-break: break-word;
      -webkit-app-region: no-drag;
    }

    #message-text.typing::after {
      content: '●●●';
      display: inline-block;
      animation: dotPulse 1.2s infinite;
      font-size: 10px;
      letter-spacing: 2px;
      color: #e8a0b0;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Input row inside bubble */
    #input-row {
      display: flex;
      gap: 5px;
      margin-top: 8px;
      align-items: center;
      -webkit-app-region: no-drag;
    }

    #user-input {
      flex: 1;
      border: 1.5px solid #f0c0d0;
      border-radius: 10px;
      padding: 5px 8px;
      font-size: 11px;
      background: #fff5f7;
      color: #4a2a3a;
      outline: none;
      transition: border-color 0.2s;
      -webkit-app-region: no-drag;
    }

    #user-input:focus {
      border-color: #e8a0b0;
    }

    #send-btn {
      background: linear-gradient(135deg, #e8607a, #c8405a);
      border: none;
      border-radius: 9px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, filter 0.15s;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    #send-btn:hover { transform: scale(1.1); filter: brightness(1.1); }
    #send-btn:active { transform: scale(0.95); }

    #send-btn svg {
      width: 14px;
      height: 14px;
      fill: white;
    }

    /* ── Quit button ── */
    #quit-btn {
      position: absolute;
      top: 2px;
      right: 8px;
      width: 18px;
      height: 18px;
      background: rgba(220, 80, 80, 0.75);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 100;
      color: white;
      font-size: 10px;
      line-height: 1;
      -webkit-app-region: no-drag;
    }

    #app:hover #quit-btn { opacity: 1; }
    #quit-btn:hover { background: rgba(200, 50, 50, 0.95); }

    /* ── Character Container ── */
    #character-wrap {
      position: relative;
      width: 180px;
      height: 210px;
      cursor: pointer;
      -webkit-app-region: drag;
      flex-shrink: 0;
    }

    #character-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.15s;
      filter: drop-shadow(0 6px 18px rgba(180, 60, 80, 0.3));
      -webkit-app-region: no-drag;
      cursor: pointer;
    }

    /* Idle float */
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      30%       { transform: translateY(-6px) rotate(0.5deg); }
      70%       { transform: translateY(-3px) rotate(-0.5deg); }
    }

    #character-img.idle {
      animation: float 3.5s ease-in-out infinite;
    }

    /* Click bounce */
    @keyframes bounce {
      0%  { transform: scale(1); }
      30% { transform: scale(1.12) translateY(-8px); }
      60% { transform: scale(0.95) translateY(2px); }
      100%{ transform: scale(1); }
    }

    #character-img.bouncing {
      animation: bounce 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
    }

    /* Sparkle emojis */
    .sparkle {
      position: absolute;
      font-size: 16px;
      pointer-events: none;
      animation: sparkleAnim 0.8s ease-out forwards;
      z-index: 50;
    }

    @keyframes sparkleAnim {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.4); }
    }
  </style>
</head>
<body>
  <div id="app">
    <button id="quit-btn" title="Close">✕</button>

    <!-- Chat bubble (hidden until click) -->
    <div id="chat-area">
      <div id="bubble">
        <div id="message-text">Hey there~! Click me to chat! ✨</div>
        <div id="input-row">
          <input id="user-input" type="text" placeholder="Ask me anything..." maxlength="200" />
          <button id="send-btn" title="Send">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 21L23 12 2 3v7l15 2-15 2v7z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Character -->
    <div id="character-wrap">
      <img
        id="character-img"
        src="./character_default.png"
        alt="Chibi Pet"
        class="idle"
        draggable="true"
      />
    </div>
  </div>

  <script>
    const chatArea   = document.getElementById('chat-area');
    const messageText = document.getElementById('message-text');
    const userInput  = document.getElementById('user-input');
    const sendBtn    = document.getElementById('send-btn');
    const charImg    = document.getElementById('character-img');
    const quitBtn    = document.getElementById('quit-btn');
    const app        = document.getElementById('app');

    let chatOpen = false;
    let isTyping = false;
    let isDragging = false;
    let dragMoved = false;
    let dragStart = { x: 0, y: 0 };
    let windowStart = null;

    const characterImages = [
      './character_default.png',
      './character_hello.png',
      './character_hi.png'
    ];

    function setRandomCharacter() {
      const next = characterImages[Math.floor(Math.random() * characterImages.length)];
      charImg.setAttribute('src', next);
    }

    // ── Toggle chat on character click ──
    charImg.addEventListener('click', (e) => {
      if (dragMoved) {
        dragMoved = false;
        return;
      }
      e.stopPropagation();
      toggleChat();
      doBounce();
      spawnSparkles(e);
    });

    // ── Drag window by character ──
    charImg.addEventListener('mousedown', async (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      dragMoved = false;
      dragStart = { x: e.screenX, y: e.screenY };
      windowStart = await window.petAPI.getWindowPosition();
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging || !windowStart) return;
      const dx = e.screenX - dragStart.x;
      const dy = e.screenY - dragStart.y;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
        dragMoved = true;
      }
      window.petAPI.setWindowPosition({
        x: windowStart.x + dx,
        y: windowStart.y + dy
      });
    });

    window.addEventListener('mouseup', () => {
      if (dragMoved) {
        setTimeout(() => { dragMoved = false; }, 0);
      }
      isDragging = false;
    });

    function toggleChat() {
      chatOpen = !chatOpen;
      if (chatOpen) {
        chatArea.classList.add('visible');
        setTimeout(() => userInput.focus(), 100);
      } else {
        chatArea.classList.remove('visible');
      }
    }

    // ── Bounce animation ──
    function doBounce() {
      charImg.classList.remove('idle', 'bouncing');
      void charImg.offsetWidth; // reflow
      charImg.classList.add('bouncing');
      charImg.addEventListener('animationend', () => {
        charImg.classList.remove('bouncing');
        charImg.classList.add('idle');
      }, { once: true });
    }

    // ── Sparkle effect ──
    function spawnSparkles(e) {
      const emojis = ['✨','⭐','💫','🌟','❤️'];
      const wrap = document.getElementById('character-wrap');
      const rect = wrap.getBoundingClientRect();

      for (let i = 0; i < 4; i++) {
        const el = document.createElement('span');
        el.className = 'sparkle';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        const x = Math.random() * 160 - 20;
        const y = Math.random() * 100 + 20;
        el.style.left = x + 'px';
        el.style.top  = y + 'px';
        el.style.setProperty('--dx', (Math.random() * 40 - 20) + 'px');
        el.style.setProperty('--dy', -(Math.random() * 50 + 20) + 'px');
        el.style.animationDelay = (i * 0.08) + 's';
        wrap.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    // ── Send message ──
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isTyping) return;

      isTyping = true;
      userInput.value = '';
      userInput.disabled = true;
      sendBtn.disabled = true;

      messageText.textContent = '';
      messageText.classList.add('typing');

      try {
        setRandomCharacter();
        const reply = await window.petAPI.askGroq(text);
        messageText.classList.remove('typing');
        // Typewriter effect
        await typeWriter(reply);
      } catch (err) {
        messageText.classList.remove('typing');
        messageText.textContent = 'Something went wrong~ (｡•́︿•̀｡)';
      }

      isTyping = false;
      userInput.disabled = false;
      sendBtn.disabled = false;
      userInput.focus();
    }

    function typeWriter(text) {
      return new Promise((resolve) => {
        messageText.textContent = '';
        let i = 0;
        const speed = Math.max(15, Math.min(40, 1200 / text.length));
        const timer = setInterval(() => {
          messageText.textContent += text[i++];
          if (i >= text.length) {
            clearInterval(timer);
            resolve();
          }
        }, speed);
      });
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
      e.stopPropagation();
    });

    // ── Stop click-through on chat area ──
    chatArea.addEventListener('click', (e) => e.stopPropagation());
    userInput.addEventListener('mousedown', (e) => e.stopPropagation());

    // ── Quit ──
    quitBtn.addEventListener('click', () => window.petAPI.quitApp());

    // ── Random idle dialogue ──
    const idleMessages = [
      'Click me to chat! ✨',
      "What's on your mind? 💭",
      'Need help? I\'m here~! 🌸',
      'Hello hello! (◕‿◕) ✨',
      'Ask me anything! 💫',
    ];
    let idleIdx = 0;

    setInterval(() => {
      if (!chatOpen && !isTyping) {
        messageText.textContent = idleMessages[idleIdx % idleMessages.length];
        idleIdx++;
        // brief bubble flash
        chatArea.classList.add('visible');
        setTimeout(() => {
          if (!chatOpen) chatArea.classList.remove('visible');
        }, 2500);
      }
    }, 18000);
  </script>
</body>
</html>
